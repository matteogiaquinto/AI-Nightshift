# Suggested labels for this repository.
# Create these labels manually in GitHub or with a label sync tool.

- name: ready-for-agent
  color: 0E8A16
  description: Approved for an AI coding agent run

- name: small
  color: C2E0C6
  description: Small isolated task

- name: safe-change
  color: BFDADC
  description: Low-risk change suitable for autonomous PR preparation

- name: no-autocode
  color: FEF2C0
  description: Analysis only; do not modify code

- name: bounded-analysis
  color: D4C5F9
  description: Analysis task has a limited inspection scope

- name: needs-human
  color: D93F0B
  description: Missing context or decision required

- name: blocked
  color: B60205
  description: Do not process until unblocked

- name: priority-high
  color: FBCA04
  description: Process before other ready tasks

- name: agent-in-progress
  color: 1D76DB
  description: Agent is currently processing this task

- name: pr-open
  color: 5319E7
  description: A pull request has been opened for this task

- name: agent-done
  color: 0E8A16
  description: Agent completed the requested deliverable

- name: agent-skipped
  color: 7057FF
  description: Agent intentionally skipped the task

- name: agent-error
  color: B60205
  description: Agent hit a tooling, permission, or runtime error

- name: risk-low
  color: C2E0C6
  description: Low-risk task

- name: risk-medium
  color: FEF2C0
  description: Medium-risk task

- name: risk-high
  color: D93F0B
  description: High-risk task; human approval required
